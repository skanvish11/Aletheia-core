name: Backend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.7
          uv sync --locked --dev
      - name: Lint and format
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Offline behavior tests
        run: uv run --locked pytest

  local-scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.7
          uv sync --locked --dev
      - name: Localhost restart and cleanup check
        run: uv run --locked python scripts/smoke_foundation.py
      - name: Small synthetic benchmark correctness and cleanup check
        run: uv run --locked python scripts/benchmark_foundation.py --sizes 10 --samples 8 --warmup 8 --repetitions 1 --output benchmark-smoke.json
